<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>단건 조회</title>

    <style>
        body {
            font-family: sans-serif;
            background: #f5f7fa;
            text-align: center;
            padding: 50px;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            background: #4f7cff;
            color: white;
            border: 0;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📖 도서 조회</h1>
        <input id="bookId" type="number" placeholder="도서 번호">
        <button id="findBtn">조회</button>
    </div>

    <p id="result"></p>

    <script>
        document.getElementById("findBtn").onclick = async () => {

            const id = document.getElementById("bookId").value;
            const res = await fetch("/books/" + id);
            const data = await res.json();
            const result = document.getElementById("result");

            if (res.status === 404) {
                result.style.color = "red";
                result.textContent = "❌ " + data.detail;

            } else if (res.ok) {
                result.style.color = "#4f7cff";
                result.textContent =
                    `${data.title} - ${data.author} (${data.year})`;

            } else {
                result.style.color = "red";
                result.textContent =
                    "❌ 요청 실패 (상태 " + res.status + ")";
            }
        };
    </script>

</body>
</html>
