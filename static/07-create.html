<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>도서 등록</title>

    <style>
        body {
            font-family: sans-serif;
            background: #f5f7fa;
            text-align: center;
            padding: 50px;
        }

        .form {
            width: 320px;
            margin: 20px auto;
            text-align: left;
        }

        .form div {
            display: flex;
            align-items: center;
            margin: 12px 0;
        }

        label {
            width: 70px;
            font-weight: bold;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            background: #4f7cff;
            color: white;
            border: 0;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>📚 도서 등록</h1>

    <div class="form">
        <div>
            <label>제목 :</label>
            <input id="title" placeholder="도서 제목">
        </div>

        <div>
            <label>저자 :</label>
            <input id="author" placeholder="저자 이름">
        </div>

        <div>
            <label>연도 :</label>
            <input id="year" type="number" placeholder="출판 연도">
        </div>

        <button id="saveBtn">등록</button>
    </div>

    <p id="result"></p>

    <script>
        document.getElementById("saveBtn").onclick = async () => {

            const payload = {
                title: document.getElementById("title").value,
                author: document.getElementById("author").value,
                year: Number(document.getElementById("year").value)
            };

            const res = await fetch("/books", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            document.getElementById("result").textContent =
                res.ok
                    ? `✅ ${data.title} 등록 완료`
                    : "❌ 등록 실패";
        };
    </script>

</body>
</html>
